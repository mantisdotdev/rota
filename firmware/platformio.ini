; Rota firmware (PRD §12). Build from the repo root:
;   pio run -d firmware -e teensy41
; Never upload or monitor from an agent session (CLAUDE.md, Commands).

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy@5.2.0
board = teensy41
framework = arduino

; platform-teensy 5.2.0 already compiles the teensy4 core with -std=gnu++17.
; Warnings apply to our sources only; the Teensy core is not ours to fix.
build_src_flags = -Wextra

; The Teensy Audio Library defaults to 44.1 kHz; the codec, the engine and every
; sample are 48 kHz (PRD §7.4, sound/limits.h). The core's AudioStream.h guards the
; rate with #ifndef, so one flag retunes the I2S clock; hal/teensy/ sets the codec
; register itself (D-083).
build_flags = -DAUDIO_SAMPLE_RATE_EXACT=48000.0f

; hal/sdl/ is the host simulator's HAL (D-016) and must never enter the firmware
; image. Setting build_src_filter replaces the default, so +<*> is restated.
build_src_filter = +<*> -<hal/sdl/>

; EVT parts (hardware/BOM.md, D-047, D-045). Pinned; bump on purpose only.
lib_deps =
	vindar/ILI9341_T4@1.7.1
	adafruit/Adafruit seesaw Library@1.7.9
